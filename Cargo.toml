[package]
name = "backshift"
version = "0.1.0"
description = "ARIMA models fitted by exact maximum likelihood, with a streaming filter that runs without a heap"
authors = ["Markus Mayer"]
repository = "https://github.com/sunsided/arima-rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["arima", "time-series", "forecasting", "kalman-filter", "no-std"]
categories = ["mathematics", "science", "no-std", "no-std::no-alloc", "embedded"]
edition = "2024"
# `f64::abs` is in `core` (needed without `std`) since 1.85.
rust-version = "1.85"
exclude = ["/ci", "/docs", "/.github", "/bindings", "/site"]

[features]
default = ["std"]
# Use the standard library's floating-point functions. Implies `alloc`.
std = ["alloc"]
# Enable the functions that return a `Vec`. Without it the crate needs no global allocator.
alloc = []
# Fit the candidates of an exhaustive `AutoArima` search in parallel.
rayon = ["std", "dep:rayon"]
# Use the pure-Rust `libm` crate on `no_std` targets.
libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2.16", optional = true }
rayon = { version = "1.10", optional = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["alloc"]

# Counts allocations on the device path; needs its own binary without the test harness.
[[test]]
name = "no_alloc"
path = "tests/no_alloc.rs"
harness = false

[[bench]]
name = "arima"
harness = false
required-features = ["alloc"]

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }
float-cmp = "0.9.0"
proptest = "1.12.0"
