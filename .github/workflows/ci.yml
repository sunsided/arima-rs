name: CI

on:
  push:
    branches: [main]
  pull_request:
  # publish-npm.yml runs these checks before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "--features rayon"
          - "--no-default-features --features libm,alloc"
          # No allocator: integration tests need `alloc` and are skipped.
          - "--no-default-features --features libm"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test ${{ matrix.features }}

  no-std:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv7em-none-eabihf, thumbv6m-none-eabi, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --lib --no-default-features --features libm --target ${{ matrix.target }}
      # With an allocator, as a firmware that has one builds it.
      - run: cargo build --lib --no-default-features --features libm,alloc --target ${{ matrix.target }}

  firmware:
    name: firmware link without allocator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
      - run: cargo build --release --target thumbv7em-none-eabihf
        working-directory: ci/firmware

  wasi:
    name: run on wasm32-wasip1 (no threads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasmtime
      # WASI hosts such as VS Code's have no threads; the default features must not need them.
      - run: cargo run --release --target wasm32-wasip1
        working-directory: ci/wasi
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

  compare:
    name: competitor comparison builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      # The README's benchmark numbers come from this crate; an API change must not break it.
      - run: cargo check --manifest-path ci/compare/Cargo.toml

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: "1.85"
      # Library only: dev-dependencies may need a newer toolchain.
      - run: cargo check --lib
      - run: cargo check --lib --no-default-features --features libm
      - run: cargo check --lib --no-default-features --features libm,alloc

  wasm-package:
    name: npm package and demo site (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The bindings are their own workspace, so the root jobs do not see them.
      - run: cargo fmt --check --manifest-path bindings/wasm/Cargo.toml
      # release-plz bumps the crate's version in its release PRs but only updates the root
      # lockfile; refresh the bindings' entry for the path dependency, keeping every registry
      # dependency locked.
      - run: cargo update --manifest-path bindings/wasm/Cargo.toml -p backshift
      - run: cargo clippy --locked --manifest-path bindings/wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: bindings/wasm/build.sh
      - run: node bindings/wasm/tests/smoke.mjs
      - run: npm pack --dry-run
        working-directory: bindings/wasm/pkg
      # The demo site consumes the package just built, as npm users would.
      - name: Check and build the demo site
        working-directory: site
        run: |
          corepack enable
          yarn install --immutable
          yarn check
          yarn build
      # The README charts are seeded and drawn by the package; they must match what it draws now.
      - name: Check the README charts are current
        run: |
          (cd site && yarn readme-charts)
          git diff --exit-code docs/img

