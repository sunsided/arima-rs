# Publishes the crate when release-plz pushes its tag vX.Y.Z. Runs in the `crates-io`
# environment, which should only allow v*.*.* tags. crates.io trusted publishing is bound to
# this file name and environment: do not rename either.
# The npm package has its own wasm-v* tags and workflow (publish-npm.yml); none match here.
name: Publish crate

on:
  push:
    tags:
      # SemVer 2.0 releases and pre-releases (v1.2.0, v1.2.0-rc.1).
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy
      # The library has no committed Cargo.lock, so these resolve fresh, as users' builds do.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features --features libm

  crates-io:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/backshift/${{ steps.crate.outputs.version }}
    permissions:
      contents: read
      id-token: write # trusted publishing: exchange the OIDC token for a crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - name: Check the tag matches the crate version
        id: crate
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "backshift") | .version')"
          if [ "$actual" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match backshift $actual"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip versions that are already on crates.io
        id: check
        # Re-runs must be harmless.
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY publish workflow" \
            "https://crates.io/api/v1/crates/backshift/$VERSION")"
          if [ "$status" = 200 ]; then
            echo "::notice::backshift $VERSION is already on crates.io; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERSION: ${{ steps.crate.outputs.version }}
      - if: steps.check.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: cargo publish -p backshift
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
