[workspace]
# Versions come from git tags; release-plz tags and creates GitHub Releases but never runs
# cargo publish. publish-crates-io.yml publishes from the tag (tag-restricted `crates-io` environment).
git_only = true
# Release only when the release PR is merged, not on every push that bumps a version.
release_always = false
# Runs cargo-semver-checks on the library; API breaks force a breaking bump.
semver_check = true
changelog_update = true
git_release_enable = true
# Versions are SemVer 2.0; pre-release versions (1.2.0-rc.1) become GitHub pre-releases.
git_release_type = "auto"
# Release PR branches follow the branching model (release/*), not the default `release-plz-`.
pr_branch_prefix = "release/"
# Imperative PR title (the default is "chore: release v..."); the changelog parser skips it via
# ^Release. {{ package }} and {{ version }} are set here: there is one crate.
pr_name = "Release{% if package and version %} {{ package }} v{{ version }}{% elif version %} v{{ version }}{% endif %}"
# Commits are imperative ("Add X", "Fix Y"), not Conventional Commits: map subject verbs to bumps.
# 0.x (Cargo's rule: 0.MINOR is the breaking position): additions and fixes are patch bumps,
# breaking changes are minor. No custom_major_increment_regex in 0.x: it would jump to 1.0.0.
custom_minor_increment_regex = "\\A(Break|Change|Rename|Replace|Remove|Drop|Delete)\\b|(?m:^BREAKING CHANGE:)"
# From 1.0.0 on, replace the line above with these two:
# custom_minor_increment_regex = "\\A(Add|Introduce|Support|Allow|Implement|Expose)\\b"
# custom_major_increment_regex = "\\ABreak\\b|(?m:^BREAKING CHANGE:)"
# Tags stay "v{{ version }}" (release-plz's default for one public crate). The npm package uses
# separate wasm-v* tags and its own workflow, publish-npm.yml.

[changelog]
commit_parsers = [
  { message = "^(Merge|Release|Bump version)\\b", skip = true },
  # Pull requests are merged with a merge commit titled "<PR title> (#N)"; the commits it merges
  # are listed already, so skip it rather than list the change twice.
  { message = "\\A[^\\n]*\\(#[0-9]+\\)[ \\t]*(\\n|\\z)", skip = true },
  { message = "^Actions: ", skip = true },
  { message = "^(Add|Introduce|Support|Allow|Implement|Expose)\\b", group = "Added" },
  { message = "^(Fix|Correct|Resolve|Prevent|Repair)\\b", group = "Fixed" },
  { message = "^Deprecate\\b", group = "Deprecated" },
  { message = "^(Remove|Drop|Delete)\\b", group = "Removed" },
  { message = "^(Secure|Harden)\\b", group = "Security" },
  { message = "^((Cargo|npm|Docker): )?Bump\\b", group = "Dependencies" },
  { message = "^.*", group = "Changed" },
]
