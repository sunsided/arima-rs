# JavaScript bindings for backshift, built with wasm-pack and published to npm as
# `@sunsided/backshift`. Not part of the crate published to crates.io; build with
#     bindings/wasm/build.sh
[package]
name = "backshift-wasm"
version = "0.1.0"
description = "ARIMA models in the browser and Node: fit, forecast with intervals, stream and refit, via WebAssembly"
authors = ["Markus Mayer"]
repository = "https://github.com/sunsided/arima-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["arima", "time-series", "forecasting", "wasm"]
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same math as the firmware build: `libm`, with an allocator for fitting.
backshift = { path = "../..", default-features = false, features = ["libm", "alloc"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Keep this crate out of any parent workspace.
[workspace]
